name = "haowu-mall-demo"
main = "dist/worker/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Serve the storefront from Workers Static Assets. API requests run through
# the compiled Pages Functions worker before falling back to static assets.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1 database binding used by the /functions API routes.
[[d1_databases]]
binding = "DB"
database_name = "haowu_mall"
database_id = "5a6b3249-e865-434d-a2e2-dd9df4c7600e"
