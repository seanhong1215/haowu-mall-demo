name = "haowu-mall"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database binding used by the /functions API routes.
# `database_id` is filled in automatically by `wrangler d1 create`
# (see README.md "Deploy to Cloudflare" section) — for local dev
# any placeholder value works because --local uses a local sqlite file.
[[d1_databases]]
binding = "DB"
database_name = "haowu_mall"
database_id = "local-placeholder-id"
