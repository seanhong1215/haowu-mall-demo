<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員登入 — 好物商城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container">
  <div class="auth-card">
    <h1 style="font-size:1.4rem;">會員登入</h1>
    <p class="text-muted">Demo 帳號：<code>demo@example.com</code> / <code>demo1234</code>，或於下方註冊新帳號。</p>
    <div class="banner banner--error" id="login-banner" hidden></div>
    <form id="login-form" class="form-grid">
      <div class="form-row">
        <label for="email">電子郵件</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--accent btn--block">登入</button>
    </form>
    <p class="text-muted" style="margin-top:20px;">還沒有帳號？<a href="/account/register.html">立即註冊</a></p>
  </div>
</main>

<footer id="site-footer"></footer>
<div id="cart-drawer-root"></div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/chrome.js"></script>
<script src="/assets/js/account-login.js"></script>
</body>
</html>
