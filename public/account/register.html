<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會員註冊 — 好物商城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container">
  <div class="auth-card">
    <h1 style="font-size:1.4rem;">建立新帳號</h1>
    <p class="text-muted">加入會員即享 NT$100 購物金，並可查詢歷史訂單。</p>
    <div class="banner banner--error" id="register-banner" hidden></div>
    <form id="register-form" class="form-grid">
      <div class="form-row">
        <label for="name">姓名</label>
        <input id="name" name="name" required autocomplete="name">
      </div>
      <div class="form-row">
        <label for="email">電子郵件</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password">
        <span class="text-muted" style="font-size:0.8rem;">至少 6 個字元。</span>
      </div>
      <button type="submit" class="btn btn--accent btn--block">建立帳號</button>
    </form>
    <p class="text-muted" style="margin-top:20px;">已經有帳號了？<a href="/account/login.html">前往登入</a></p>
  </div>
</main>

<footer id="site-footer"></footer>
<div id="cart-drawer-root"></div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/cart.js"></script>
<script src="/assets/js/chrome.js"></script>
<script src="/assets/js/account-register.js"></script>
</body>
</html>
