<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — 好物商城 Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="admin-shell">
<div class="admin-topbar">
  <span class="admin-topbar__logo">好物商城 — Admin</span>
  <div>
    <a href="/index.html" class="text-muted" style="margin-right:16px;text-decoration:none;">View store ↗</a>
    <button class="btn btn--small btn--outline" id="logout-btn" type="button">Log out</button>
  </div>
</div>

<main class="admin-main">
  <div class="admin-tabs" role="tablist">
    <button data-tab="orders" aria-selected="true" role="tab">Orders</button>
    <button data-tab="inventory" aria-selected="false" role="tab">Inventory</button>
  </div>

  <div id="panel-orders" role="tabpanel"></div>
  <div id="panel-inventory" role="tabpanel" hidden></div>
</main>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/order-timeline.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
