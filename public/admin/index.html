<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賣家後台 — 好物商城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="admin-shell">

<!-- 圖示以 <symbol> 集中定義，畫面上用 <use href="#i-…"> 引用；
     全部是線條式 SVG，縮放與換色都跟著 currentColor 走 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-orders"><path d="M7 3.5H5.5A1.5 1.5 0 0 0 4 5v11a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 16 16V5a1.5 1.5 0 0 0-1.5-1.5H13"/><rect x="7" y="2" width="6" height="3" rx="1"/><path d="M7.5 9.5h5M7.5 13h3"/></g>
    <g id="i-box"><path d="M17 6.6 10 3 3 6.6v6.8L10 17l7-3.6V6.6Z"/><path d="M3 6.6 10 10.2l7-3.6M10 10.2V17"/></g>
    <g id="i-users"><circle cx="7.8" cy="7" r="2.8"/><path d="M2.8 16.5c0-2.6 2.24-4.4 5-4.4s5 1.8 5 4.4"/><path d="M13.4 4.6a2.8 2.8 0 0 1 0 5.3M14.6 12.6c1.7.55 2.9 1.95 2.9 3.9"/></g>
    <g id="i-history"><path d="M3.3 10a6.7 6.7 0 1 0 1.96-4.74"/><path d="M3 3.4v3.2h3.2"/><path d="M10 6.4V10l2.6 1.6"/></g>
    <g id="i-external"><path d="M11 3.5h5.5V9"/><path d="M16.5 3.5 9 11"/><path d="M14.5 11.6V15A1.5 1.5 0 0 1 13 16.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5h3.4"/></g>
    <g id="i-logout"><path d="M8 16.5H5A1.5 1.5 0 0 1 3.5 15V5A1.5 1.5 0 0 1 5 3.5h3"/><path d="M12.5 13.2 15.7 10l-3.2-3.2"/><path d="M15.7 10H7.6"/></g>
    <g id="i-search"><circle cx="8.8" cy="8.8" r="5.3"/><path d="M12.7 12.7 16.5 16.5"/></g>
    <g id="i-chevron-right"><path d="M8 5.5 12.5 10 8 14.5"/></g>
    <g id="i-arrow-left"><path d="M16 10H4"/><path d="M8.5 5.5 4 10l4.5 4.5"/></g>
    <g id="i-plus"><path d="M10 4.5v11M4.5 10h11"/></g>
    <g id="i-minus"><path d="M4.5 10h11"/></g>
    <g id="i-alert"><path d="M10 3.3 2.6 16.2h14.8L10 3.3Z"/><path d="M10 8v3.4M10 13.7v.1"/></g>
    <g id="i-image"><rect x="3" y="4" width="14" height="12" rx="1.5"/><circle cx="7.6" cy="8.4" r="1.4"/><path d="M3.4 14.2 7.6 10.6l3.1 2.6 2.6-2.2 3.3 2.8"/></g>
    <g id="i-upload"><path d="M10 13.5V4.2"/><path d="M6.4 7.8 10 4.2l3.6 3.6"/><path d="M3.6 12.8V15A1.5 1.5 0 0 0 5.1 16.5h9.8A1.5 1.5 0 0 0 16.4 15v-2.2"/></g>
    <g id="i-mail"><rect x="2.8" y="4.6" width="14.4" height="10.8" rx="1.5"/><path d="M3.2 5.6 10 10.8l6.8-5.2"/></g>
    <g id="i-card"><rect x="2.5" y="4.6" width="15" height="10.8" rx="1.5"/><path d="M2.5 8.4h15M5.6 12.4h3"/></g>
    <g id="i-truck"><path d="M2.8 5.4h8.4v8.2H2.8z"/><path d="M11.2 8.4h2.9l2.6 2.6v2.6h-5.5z"/><circle cx="6" cy="15.2" r="1.5"/><circle cx="13.6" cy="15.2" r="1.5"/></g>
    <g id="i-pin"><path d="M10 17s5.2-4.6 5.2-8.4a5.2 5.2 0 1 0-10.4 0C4.8 12.4 10 17 10 17Z"/><circle cx="10" cy="8.5" r="1.9"/></g>
  </defs>
</svg>

<aside class="admin-sidebar">
  <a class="admin-sidebar__brand" href="/admin/index.html">
    <span class="admin-sidebar__mark"></span>
    <span class="admin-sidebar__name"><b>好物商城</b><span>賣家後台</span></span>
  </a>

  <nav class="admin-sidebar__nav" id="admin-nav">
    <div class="admin-sidebar__group">
      <div class="admin-sidebar__group-label">營運</div>
      <button class="admin-sidebar__link is-active" type="button" data-view="orders">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-orders"></use></svg>
        <span>訂單管理</span>
        <span class="admin-sidebar__badge" id="nav-pending" hidden></span>
      </button>
    </div>
    <div class="admin-sidebar__group">
      <div class="admin-sidebar__group-label">商品</div>
      <button class="admin-sidebar__link" type="button" data-view="catalog">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-box"></use></svg>
        <span>商品與庫存</span>
        <span class="admin-sidebar__dot" id="nav-lowstock" hidden title="有規格庫存偏低"></span>
      </button>
    </div>
    <div class="admin-sidebar__group">
      <div class="admin-sidebar__group-label">顧客</div>
      <button class="admin-sidebar__link" type="button" data-view="customers">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-users"></use></svg>
        <span>會員管理</span>
      </button>
    </div>
    <div class="admin-sidebar__group">
      <div class="admin-sidebar__group-label">系統</div>
      <button class="admin-sidebar__link" type="button" data-view="activity">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-history"></use></svg>
        <span>操作紀錄</span>
      </button>
    </div>
  </nav>

  <div class="admin-sidebar__footer">
    <a href="/index.html">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-external"></use></svg>
      查看前台
    </a>
    <div class="admin-sidebar__user">
      <span class="admin-sidebar__avatar">管</span>
      <span class="admin-sidebar__who"><b>管理員</b><span>admin@haowu.tw</span></span>
      <button class="admin-sidebar__logout" id="logout-btn" type="button" aria-label="登出">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-logout"></use></svg>
      </button>
    </div>
  </div>
</aside>

<div class="admin-content">
  <header class="admin-header">
    <div>
      <h1 id="page-title">訂單管理</h1>
      <p id="page-subtitle">載入中…</p>
    </div>
    <div class="admin-header__actions" id="page-actions"></div>
  </header>
  <main class="admin-body" id="admin-view"></main>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/order-timeline.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
