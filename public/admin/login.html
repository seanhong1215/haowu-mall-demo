<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賣家後台登入 — 好物商城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="admin-shell">
<div class="admin-login">
  <h1 style="font-size:1.4rem;">賣家後台</h1>
  <p class="text-muted">Demo 密碼為 <code>demo1234</code>（除非已透過環境變數 ADMIN_PASSWORD 另行設定）。</p>
  <div class="banner banner--error" id="login-banner" hidden></div>
  <form id="login-form" class="form-grid">
    <div class="form-row">
      <label for="password">密碼</label>
      <input id="password" name="password" type="password" required autofocus>
    </div>
    <button type="submit" class="btn btn--accent btn--block">登入</button>
  </form>
  <p style="margin-top:20px;"><a href="/index.html" class="text-muted">← 回到前台</a></p>
</div>

<script src="/assets/js/api.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const banner = document.getElementById("login-banner");
  banner.hidden = true;
  try {
    await Api.post("/api/admin/login", { password: e.target.password.value });
    location.href = "/admin/index.html";
  } catch (err) {
    banner.hidden = false;
    banner.textContent = err.message;
  }
});
</script>
</body>
</html>
